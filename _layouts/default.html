<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name="color-scheme" content="light dark">

    <!-- Follow the operating system's light/dark setting. Runs before the CSS loads to avoid a flash. -->
    <script>
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() {
          document.documentElement.setAttribute('data-bs-theme', dark.matches ? 'dark' : 'light');
        }
        apply();
        dark.addEventListener('change', apply);
      })();
    </script>

    <!-- meta robots -->
    {% if page.metatags %} <meta name="robots" content="{{page.metatags}}">{% endif %}

    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
    <link rel="stylesheet" type="text/css" href="/css/main.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>

    {% if page.custom_js %}
        {% for js_file in page.custom_js %}
        <script src='{{ js_file }}' type="text/javascript"></script>
        {% endfor %}
        <script>
          // Chart.js 2 defaults to dark-grey labels and grid lines, which vanish on a dark background.
          if (window.Chart && Chart.defaults.global && document.documentElement.getAttribute('data-bs-theme') === 'dark') {
            Chart.defaults.global.defaultFontColor = '#b4b8be';
            Chart.defaults.scale.gridLines.color = 'rgba(255, 255, 255, 0.1)';
          }
        </script>
    {% endif %}

    <meta name="google-site-verification" content="5hPNIY_cvIoCAkAHJEd0Bzr1N5txJohoz1WS9VKS7Xc" />
    {% seo %}
  </head>
  <body>

      <header class="site-header">
        <nav class="navbar navbar-expand-sm">
          <div class="container container-wide">
            <a class="navbar-brand" href="/">@wrede</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link {% if page.nav == 'about' %}active{% endif %}" href="/">About me</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link {% if page.nav == 'projects' %}active{% endif %}" href="/projects/">Projects</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link {% if page.nav == 'blog' %}active{% endif %}" href="/blog/">Blog</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="site-footer">
        {% include footer.html %}
      </footer>
      <!-- Fathom - beautiful, simple website analytics -->
      <script src="https://cdn.usefathom.com/script.js" data-site="FOLZOONQ" defer></script>
      <!-- / Fathom -->
  </body>
</html>
